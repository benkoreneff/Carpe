name: Carpe

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    GENERATE_INFOPLIST_FILE: YES
    # Signing is fixed on purpose. macOS ties the Screen Recording and Calendar
    # grants and the Keychain items to the bundle ID plus the signing
    # certificate, so an ad-hoc signature or a changed bundle ID makes them
    # disappear on the next build. Development builds use the same Developer ID
    # certificate as the released app: with another one, macOS treats the build
    # folder's copy and the installed copy as two apps that share a name, and
    # each has to be granted everything separately.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Developer ID Application
    DEVELOPMENT_TEAM: 375L8HDHKR

targets:
  Carpe:
    type: application
    platform: macOS
    sources:
      - Carpe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koreneff.carpe
        PRODUCT_NAME: Carpe
        # The app icon, from Carpe/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Apple Calendar: the entitlement lets EventKit work under the hardened
        # runtime, and macOS shows the text when it asks for calendar access.
        CODE_SIGN_ENTITLEMENTS: Carpe/Carpe.entitlements
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Carpe adds the events it reads from your screenshots to the calendar you choose, and removes one again when you choose Undo."
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Carpe
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity

  # Logic tests: compiles Carpe/Core directly, so the tests never launch the
  # menu bar app or touch the Keychain.
  CarpeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CarpeTests
      - Carpe/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koreneff.carpeTests

schemes:
  Carpe:
    build:
      targets:
        Carpe: all
        CarpeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CarpeTests
